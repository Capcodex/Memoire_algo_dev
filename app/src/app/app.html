<div class="app-shell" [class.presentation-shell]="presentationMode()">
  <div class="ambient-orb ambient-orb-left"></div>
  <div class="ambient-orb ambient-orb-right"></div>

  <button type="button" class="mobile-menu-button" aria-label="Ouvrir la navigation" (click)="toggleMobileMenu()">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
  </button>

  <button *ngIf="mobileMenuOpen()" type="button" class="fixed inset-0 z-30 bg-slate-950/70 backdrop-blur-sm lg:hidden" aria-label="Fermer la navigation" (click)="toggleMobileMenu()"></button>

  <aside class="app-sidebar" [class.sidebar-open]="mobileMenuOpen()" [class.sidebar-hidden]="presentationMode()">
    <div class="border-b border-white/5 p-5">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl border border-violet-400/30 bg-violet-500/10 font-black text-violet-300">B+</div>
        <div>
          <h1 class="bg-gradient-to-r from-indigo-300 to-violet-300 bg-clip-text text-lg font-black text-transparent">Index B-Tree</h1>
          <p class="mt-0.5 text-[0.62rem] font-bold uppercase tracking-[0.2em] text-slate-500">Mémoire interactif</p>
        </div>
      </div>
    </div>

    <nav class="flex-1 space-y-1.5 overflow-y-auto p-3" aria-label="Chapitres du mémoire">
      <a
        *ngFor="let chapter of chapters"
        [routerLink]="chapter.path"
        routerLinkActive="chapter-link-active"
        class="chapter-link group"
      >
        <span class="h-8 w-1 shrink-0 rounded-full opacity-70 transition group-hover:opacity-100" [ngClass]="chapterAccentClass(chapter.accent)"></span>
        <span class="w-7 shrink-0 font-mono text-[0.65rem] font-bold text-slate-600">{{ chapter.number }}</span>
        <span class="min-w-0">
          <span class="block truncate text-sm font-semibold">{{ chapter.title }}</span>
          <span class="mt-0.5 block truncate text-[0.65rem] text-slate-600">{{ chapter.subtitle }}</span>
        </span>
      </a>
    </nav>

    <div class="border-t border-white/5 p-3">
      <button type="button" class="w-full rounded-xl border border-violet-400/20 bg-violet-500/10 px-3 py-3 text-left text-xs font-semibold text-violet-200 transition hover:bg-violet-500/20" (click)="togglePresentation()">
        <span class="block">▶ Mode soutenance</span>
        <span class="mt-1 block font-normal text-violet-300/60">Masquer le cadre · touche P</span>
      </button>
    </div>
  </aside>

  <main class="app-main" [class.main-presentation]="presentationMode()">
    <header class="app-toolbar" [class.toolbar-presentation]="presentationMode()">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2 text-[0.65rem] font-bold uppercase tracking-[0.18em] text-slate-500">
          <span>{{ currentChapter().part }}</span><span>·</span><span>{{ currentIndex() + 1 }} / {{ chapters.length }}</span>
        </div>
        <p class="mt-1 truncate text-sm font-bold text-slate-100 sm:text-base">{{ currentChapter().title }}</p>
      </div>

      <div class="hidden items-center gap-1 rounded-xl border border-white/10 bg-slate-950/40 p-1 sm:flex">
        <button type="button" class="toolbar-icon" aria-label="Chapitre précédent" [disabled]="currentIndex() === 0" (click)="navigateRelative(-1)">←</button>
        <button type="button" class="toolbar-icon" aria-label="Chapitre suivant" [disabled]="currentIndex() === chapters.length - 1" (click)="navigateRelative(1)">→</button>
      </div>

      <button type="button" class="toolbar-action flex items-center gap-2" [class.toolbar-action-active]="presentationMode()" (click)="togglePresentation()">
        <span class="hidden sm:inline">{{ presentationMode() ? 'Quitter la soutenance' : 'Mode soutenance' }}</span>
        <kbd class="kbd-badge">P</kbd>
      </button>
      <button type="button" class="toolbar-icon relative group" [attr.aria-label]="isFullscreen() ? 'Quitter le plein écran' : 'Passer en plein écran'" (click)="toggleFullscreen()">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3" /></svg>
        <span class="absolute -bottom-8 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap text-[0.6rem] bg-slate-800 border border-white/10 px-1.5 py-0.5 rounded shadow"><kbd class="kbd-badge border-none bg-transparent p-0 text-white shadow-none">F</kbd> Plein écran</span>
      </button>

      <div class="absolute inset-x-0 bottom-0 h-0.5 bg-slate-800">
        <div class="h-full bg-gradient-to-r from-indigo-400 via-violet-400 to-fuchsia-400 transition-all duration-500" [style.width.%]="progress()"></div>
      </div>
    </header>

    <div class="route-viewport">
      <router-outlet></router-outlet>
    </div>

    <div *ngIf="presentationMode()" class="presentation-controls">
      <button type="button" class="presentation-arrow" aria-label="Chapitre précédent" [disabled]="currentIndex() === 0" (click)="navigateRelative(-1)">←</button>
      <span class="px-2 text-xs font-semibold text-slate-400">{{ currentChapter().number }} · {{ currentChapter().title }}</span>
      <button type="button" class="presentation-arrow" aria-label="Chapitre suivant" [disabled]="currentIndex() === chapters.length - 1" (click)="navigateRelative(1)">→</button>
    </div>
  </main>
</div>
